 x="458" y="981" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC12 Analisar candidaturas e atualizar status</text><ellipse cx="424" cy="1041" rx="134" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="424" y="1045" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC13 Consultar Banco de Talentos</text><ellipse cx="393.3" cy="1105" rx="103.3" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="393.3" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC15 Gerenciar usuários</text><ellipse cx="399.3" cy="1169" rx="109.3" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="399.3" y="1173" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC16 Gerenciar categorias</text><ellipse cx="448.7" cy="1233" rx="158.7" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="448.7" y="1237" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC17 Gerenciar cursos, e-books e vídeos</text><ellipse cx="403.3" cy="1297" rx="113.3" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="403.3" y="1301" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC20 Gerenciar assinaturas</text><ellipse cx="442" cy="1361" rx="152" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="442" y="1365" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC18 Acompanhar painéis e indicadores</text><ellipse cx="385.3" cy="1425" rx="95.3" ry="19" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="385.3" y="1429" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC29 Encerrar sessão</text><ellipse cx="997.3" cy="977" rx="132.7" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="997.3" y="974.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC21 Aplicar padrões automáticos</text><text x="997.3" y="987.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(quando as regras não identificam)</text><ellipse cx="997.3" cy="529" rx="132.7" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="997.3" y="526.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC22 Ler currículo e extrair dados</text><text x="997.3" y="539.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(gerar relatório para revisão)</text><ellipse cx="1000.7" cy="913" rx="129.3" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="1000.7" y="910.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC23 Ler anúncio/cartaz de vaga</text><text x="1000.7" y="923.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(OCR e extração de dados)</text><ellipse cx="994.7" cy="657" rx="135.3" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="994.7" y="654.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC24 Calcular e atualizar match</text><text x="994.7" y="667.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(competências, cargo, local e nível)</text><ellipse cx="996" cy="1233" rx="134" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="996" y="1230.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC25 Interpretar ficha de conteúdo</text><text x="996" y="1243.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(conferir links e arquivos)</text><ellipse cx="995.3" cy="145" rx="134.7" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="995.3" y="142.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC26 Bloquear tentativas repetidas</text><text x="995.3" y="155.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(proteção do login)</text><ellipse cx="1012" cy="1361" rx="118" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="1012" y="1358.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC27 Limpar uploads órfãos</text><text x="1012" y="1371.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(mais de 24 h; máx. 1 vez/dia)</text><ellipse cx="1014.7" cy="1297" rx="115.3" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="1014.7" y="1294.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">UC28 Expirar plano vencido</text><text x="1014.7" y="1307.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(remover destaque Premium)</text><g stroke="#000" stroke-width="1" fill="none"><circle cx="55" cy="419" r="8" fill="#fff"/><line x1="55" y1="427" x2="55" y2="449"/><line x1="42" y1="434" x2="68" y2="434"/><line x1="55" y1="449" x2="45" y2="467"/><line x1="55" y1="449" x2="65" y2="467"/></g><text x="55" y="485" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Candidato</text><g stroke="#000" stroke-width="1" fill="none"><circle cx="55" cy="699" r="8" fill="#fff"/><line x1="55" y1="707" x2="55" y2="729"/><line x1="42" y1="714" x2="68" y2="714"/><line x1="55" y1="729" x2="45" y2="747"/><line x1="55" y1="729" x2="65" y2="747"/></g><text x="55" y="765" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Empresa</text><g stroke="#000" stroke-width="1" fill="none"><circle cx="55" cy="904" r="8" fill="#fff"/><line x1="55" y1="912" x2="55" y2="934"/><line x1="42" y1="919" x2="68" y2="919"/><line x1="55" y1="934" x2="45" y2="952"/><line x1="55" y1="934" x2="65" y2="952"/></g><text x="55" y="970" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Administrador</text><g stroke="#000" stroke-width="1" fill="none"><circle cx="139