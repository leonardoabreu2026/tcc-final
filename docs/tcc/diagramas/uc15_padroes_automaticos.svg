 font-size="11" text-anchor="middle">Revisar e salvar (o cadastro</text><text x="297.7" y="347.3" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">entra nos padrões)</text><ellipse cx="566.3" cy="100" rx="111.3" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="566.3" y="97.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Ver os padrões automáticos</text><text x="566.3" y="110.5" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">usados no relatório</text><ellipse cx="567" cy="208.8" rx="112" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="567" y="206.3" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Aplicar os padrões (só onde</text><text x="567" y="219.3" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">a regra não tem pista)</text><ellipse cx="871.7" cy="170.4" rx="136.7" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="871.7" y="167.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Montar os padrões dos cadastros</text><text x="871.7" y="180.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">(2 ou mais, 90% no mesmo destino)</text><ellipse cx="841" cy="253.6" rx="106" ry="23" fill="#FFFFE0" stroke="#000" stroke-width="1"/><text x="841" y="251.1" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Reconhecer empresas e</text><text x="841" y="264.1" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">instituições já cadastradas</text><g stroke="#000" stroke-width="1" fill="none"><circle cx="60" cy="154" r="8" fill="#fff"/><line x1="60" y1="162" x2="60" y2="184"/><line x1="47" y1="169" x2="73" y2="169"/><line x1="60" y1="184" x2="50" y2="202"/><line x1="60" y1="184" x2="70" y2="202"/></g><text x="60" y="220" font-family="Arial, Helvetica, sans-serif" font-