<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>Fluxo do Calibrador das máquinas de extração</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Calibrador das máquinas de extração — regras + termos + nomes conhecidos</text>

  <!-- linha principal -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="70" width="160" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="100" y="98" text-anchor="middle" font-weight="700">Texto lido</text>
    <text x="100" y="120" text-anchor="middle">anúncio, cartaz (OCR),</text>
    <text x="100" y="138" text-anchor="middle">ficha de curso</text>
    <text x="100" y="156" text-anchor="middle">ou currículo</text>

    <rect x="215" y="70" width="160" height="96" rx="8" fill="#fff7d6" stroke="#b08900"/>
    <text x="295" y="98" text-anchor="middle" font-weight="700">1. Regras do código</text>
    <text x="295" y="120" text-anchor="middle">palavras-chave dão</text>
    <text x="295" y="138" text-anchor="middle">um palpite (ex.: "VT"</text>
    <text x="295" y="156" text-anchor="middle">→ Benefícios)</text>

    <rect x="410" y="70" width="160" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="490" y="98" text-anchor="middle" font-weight="700">2. Termos calibrados</text>
    <text x="490" y="120" text-anchor="middle">o termo vale mais</text>
    <text x="490" y="138" text-anchor="middle">que a regra; o termo</text>
    <text x="490" y="156" text-anchor="middle">mais longo vence</text>

    <rect x="605" y="70" width="160" height="96" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="685" y="98" text-anchor="middle" font-weight="700">3. Nomes conhecidos</text>
    <text x="685" y="120" text-anchor="middle">empresa ou instituição</text>
    <text x="685" y="138" text-anchor="middle">já cadastrada, quando</text>
    <text x="685" y="156" text-anchor="middle">a regra não achou</text>

    <rect x="800" y="70" width="140" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="870" y="98" text-anchor="middle" font-weight="700">Formulário</text>
    <text x="870" y="120" text-anchor="middle">para revisar +</text>
    <text x="870" y="138" text-anchor="middle">"Ajustes do</text>
    <text x="870" y="156" text-anchor="middle">calibrador"</text>
  </g>
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <path d="M180,118 L211,118"/>
    <path d="M375,118 L406,118"/>
    <path d="M570,118 L601,118"/>
    <path d="M765,118 L796,118"/>
  </g>

  <!-- de onde vêm os termos e os nomes -->
  <g font-size="13" fill="#1f2937">
    <rect x="380" y="235" width="220" height="92" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-dasharray="6 4"/>
    <text x="490" y="261" text-anchor="middle" font-weight="700">Painel → Calibrador</text>
    <text x="490" y="282" text-anchor="middle">o administrador cadastra:</text>
    <text x="490" y="300" text-anchor="middle">"quando o texto tiver X,</text>
    <text x="490" y="318" text-anchor="middle">mande para Y"</text>

    <rect x="620" y="235" width="200" height="92" rx="8" fill="#ffffff" stroke="#15803d" stroke-dasharray="6 4"/>
    <text x="720" y="261" text-anchor="middle" font-weight="700">Vagas e cursos salvos</text>
    <text x="720" y="282" text-anchor="middle">anunciante, nome fantasia</text>
    <text x="720" y="300" text-anchor="middle">e instituição entram</text>
    <text x="720" y="318" text-anchor="middle">sozinhos (sem treino)</text>

    <rect x="120" y="235" width="230" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-dasharray="6 4"/>
    <text x="235" y="261" text-anchor="middle" font-weight="700">Testar as máquinas</text>
    <text x="235" y="282" text-anchor="middle">cola um texto e vê o que</text>
    <text x="235" y="300" text-anchor="middle">cada passo decidiu —</text>
    <text x="235" y="318" text-anchor="middle">nada é salvo</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#seta)">
    <path d="M490,235 L490,170"/>
    <path d="M700,235 L690,170"/>
    <path d="M235,235 C235,200 130,195 105,170"/>
  </g>
  <text x="480" y="372" text-anchor="middle" font-size="13" fill="#4b5563">Tudo é determinístico: o mesmo texto com os mesmos termos dá sempre o mesmo resultado — nada é treinado nem adivinhado.</text>
</svg>
